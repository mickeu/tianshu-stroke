schema:
  schema_id: stroke_bg5cgq
  name: 天枢笔画
  version: '1.3'
  author:
  - BG5CGQ
  - Hamster Team
  description: '九宫格笔画输入法（参照百度输入法笔画，BG5CGQ 适配天枢）。键位: 1一 2丨 3丿 4丶 5乛 6分词 7通配 8， 9。'
switches:
- name: ascii_mode
  reset: 0
  states:
  - 中文
  - 西文
- name: full_shape
  states:
  - 半角
  - 全角
engine:
  processors:
  - ascii_composer
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  segmentors:
  - ascii_segmentor
  - matcher
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  translators:
  - punct_translator
  - table_translator
speller:
  alphabet: 12345?'
  delimiter: ' '
menu:
  page_size: 9
translator:
  dictionary: stroke_bg5cgq
  preedit_format:
  - xlit/12345/一丨丿丶乛/
  enable_sentence: true
  enable_completion: true
  enable_user_dict: true
  user_dict: stroke_bg5cgq.userdb
  db_class: userdb
  enable_encoder: true
  encode_commit_history: true
  max_phrase_length: 4
  initial_quality: 1.0
key_binder:
  import_preset: default
  bindings:
  - when: composing
    accept: '6'
    send: ''''
  - when: has_menu
    accept: space
    send: Select
  - when: composing
    accept: Return
    send: Escape
punctuator:
  import_preset: default
  mappings:
    '8': ，
    '9': 。
