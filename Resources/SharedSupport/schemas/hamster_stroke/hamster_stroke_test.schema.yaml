schema:
  schema_id: hamster_stroke_test
  name: 五笔画·试验
  version: '0.1'
  description: 一丨丿丶折 = h s p n z；分词为手动字界；无通配
switches:
- name: ascii_mode
  reset: 0
  states:
  - 笔画
  - 西文
engine:
  processors:
  - ascii_composer
  - key_binder
  - speller
  - selector
  - navigator
  - express_editor
  segmentors:
  - ascii_segmentor
  - abc_segmentor
  - fallback_segmentor
  translators:
  - table_translator
speller:
  alphabet: hspnz
  delimiter: ''''
menu:
  page_size: 9
translator:
  dictionary: hamster_stroke_test
  enable_user_dict: false
  enable_sentence: true
  enable_completion: true
  preedit_format:
  - xlit/hspnz/一丨丿丶折/
  comment_format:
  - xlit/hspnz/一丨丿丶折/
key_binder:
  bindings:
  - when: composing
    accept: Escape
    send: Escape
