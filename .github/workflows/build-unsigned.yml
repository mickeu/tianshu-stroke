name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {submodules: true}
      - name: Install prebuilt RIME frameworks
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/Frameworks.tgz https://github.com/thomfang/LibrimeKit-iOS/releases/download/v0.2.2/Frameworks.tgz
          echo '43a0921538827fedb2679e5d26bb389dec3759d44ccdcfd439e8ec21a7f93223  /tmp/Frameworks.tgz' | shasum -a 256 -c -
          mkdir -p Frameworks
          tar -xzf /tmp/Frameworks.tgz -C Frameworks
          for lib in librime boost_thread boost_filesystem boost_regex boost_system libglog libleveldb libmarisa libopencc libyaml-cpp; do
            test -f "Frameworks/$lib.xcframework/Info.plist"
          done
      - name: Build schemas
        shell: bash
        run: make schema
      - name: Audit public tree
        run: python3 ci_scripts/audit_public.py
      - name: Test App Group access policy
        run: python3 ci_scripts/test_appgroup.py
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Archive without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project Hamster.xcodeproj -scheme Hamster -sdk iphoneos -configuration Release -archivePath "$RUNNER_TEMP/Hamster.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          APP=$(find "$RUNNER_TEMP/Hamster.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/tianshu-appgroup-fix.ipa" Payload)
          unzip -tq tianshu-appgroup-fix.ipa
          unzip -Z1 tianshu-appgroup-fix.ipa > "$RUNNER_TEMP/ipa-files.txt"
          grep -E '^Payload/[^/]+\.app/$' "$RUNNER_TEMP/ipa-files.txt"
          grep -E '^Payload/[^/]+\.app/PlugIns/[^/]+\.appex/$' "$RUNNER_TEMP/ipa-files.txt"
      - name: Upload IPA and archive
        uses: actions/upload-artifact@v4
        with:
          name: tianshu-unsigned-ipa
          path: |
            tianshu-appgroup-fix.ipa
            ${{ runner.temp }}/Hamster.xcarchive
          if-no-files-found: error
